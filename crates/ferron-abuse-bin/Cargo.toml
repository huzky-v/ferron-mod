[package]
name = "ferron-abuse-bin"
version = "0.1.0"
description = "Custom Ferron entrypoint with abuse protection"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferron"
path = "src/main.rs"

[dependencies]
ferron-abuse-protection = { path = "../ferron-abuse-protection" }
ferron-text-errors = { path = "../ferron-text-errors" }
ferron-dns-acmedns = { path = "../ferron-dns-acmedns" }
ferron-tls-tailscale = { path = "../ferron-tls-tailscale" }
ferron-core = { git = "https://github.com/ferronweb/ferron.git", rev = "63648d8c93d214f70686a0db72cfaec778f57156", version = "3.0.0-rc.11" }
ferron-entrypoint = { git = "https://github.com/ferronweb/ferron.git", rev = "63648d8c93d214f70686a0db72cfaec778f57156", version = "3.0.0-rc.11", features = ["profile-default"] }

[dev-dependencies]
abuse-core = { path = "../abuse-core" }
libc = "0.2"
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1"
tempfile = "3.14"
