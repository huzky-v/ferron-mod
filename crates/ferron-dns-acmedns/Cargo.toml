[package]
name = "ferron-dns-acmedns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ferron-core = { git = "https://github.com/ferronweb/ferron.git", rev = "eabdbdc2079e5c92a80c4cdb324a8d2d6094cc6d", version = "3.0.0-rc.10" }
ferron-dns = { git = "https://github.com/ferronweb/ferron.git", rev = "eabdbdc2079e5c92a80c4cdb324a8d2d6094cc6d", version = "3.0.0-rc.10" }
async-trait = "0.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
